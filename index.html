<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customizable Sheet Music</title>
    </head>
    <body>
        <div class="menu-bar">
  <div class="menu-item">
    File
    <div class="dropdown">
      <button id="save">Save</button>
      <button id="new-save">Save As</button>
    <!-- Load with submenu -->
    <div class="has-submenu">
    <button class="submenu-toggle">Load ▸</button>
    <div id="savesContainer" class="submenu"></div>
    </div>
    <button id="new file">New</button>
    <button id="delete">Delete</button>
    <button id="print">Print</button>
    </div>
  </div>
  <div class="menu-item">
    Edit
    <div class="dropdown">
      <button id="clear">Clear</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
    </div>
  </div>
</div>
<!-- Save As Modal -->
<div id="saveAsModal" class="modal">
  <div class="modal-content">
    <span id="closeModal" class="close">&times;</span>
    <h3>Save As</h3>
    <form id="saveAsForm">
      <label for="filename">File Name:</label>
      <input type="text" id="filename" name="filename" required>
      <div class="modal-actions">
        <button type="submit">Save</button>
        <button type="button" id="cancelSave">Cancel</button>
      </div>
    </form>
  </div>
</div>


        <!-- Toggle Button -->
        <button class="menu-btn" onclick="toggleSidebar()">&#9776</button>
        <button class="menu-btn2" onclick="toggleSidebar2()">&#9881;</button>
        <div id="sidebar2" class="sidebar">
            <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar2()">&times;</a>
            <a href="javascript:void(0)" onclick="toggleOptions()">Configurations</a>
            <div id="config" class="config-button">
                <button id="Change Scale">Change Scale</button>
                <button id="Add NoteHeads">Add NoteHeads</button>
                <button id="Change Title">Change Title</button>
                <button id="clear">Clear</button>
                <button id="new page">New Page</button>
                <button id="delete page">Delete Page</button>
            </div>
        </div>
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar()">&times;</a>
        <a href="javascript:void(0)" onclick="toggleOptions()">Options</a>
        <p>Add Bar</p>
        <div id="button-container">
            <button id="Add Clef">Add Clef (Line)</button>
        </div>
        <button id="Add Bar (all)">Add Bar (all)</button> 
        <button id="Remove Bars">Remove Bar(s)</button>
        <button id="Add Line">Add Line</button>
        <div id="countainer">
            <button id="Add/Change Clef">Add/Change Clef</button>
        </div>
        <div id="countainer2">
            <button id="Add/Change Time Signature">Add/Change Time Signature</button>
        </div>
        <div id="countainer3">
            <button id="Add/Change Key Signature">Add/Change Key Signature</button>
        </div>
        <div id="countainer4">
            <button id="Add/Change Notes">Add/Change Voice</button>
        </div>
        </div>
        <!-- Main Elements-->
        <div id="main">
            <div class="a4-paper">
                <h1 id ="title" class="content"></h1>
                <div id="output" class = "content"></div>
            </div>
        </div>

        <script type="module" src="options.js"></script>
        <script type="module" src="staveManagement.js"></script>
        <script type="module" src="selector.js"></script>
        <script type="module" src="sheetmusic.js"></script>
        <script type="module" src="configurations.js"></script>
        <script src="hotbar.js"></script>
        <script src="sidebar.js"></script>
        <link rel="stylesheet" href="./sidebarStyle.css">
    </body>
