<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customizable Sheet Music</title>
        <link rel="stylesheet" href="/Easy-Score/sidebarStyle.css">
    </head>
    <body>
      <div id="low-left-sidebar">
        <div id="page-managing">
          <div id="currentPage"></div>
            <button id="new page">Add</button>
            <button id="delete page">Del</button>
            <button id="clear-page">Clear</button>
        </div>


        <div class="scale-control">
            <label for="scaleSlider">
               <span id="scaleValue"></span>
            </label>

            <input
                type="range"
                id="scaleSlider"
                min="50"
                max="150"
                value="100"
                step="5"
            >
        </div>

      </div>
      
        <div class="menu-bar">
          
  <div class="menu-item">
    File
    <div class="dropdown">
      <button id="save">Save</button>
      <button id="new-save">Save As</button>
    <!-- Load with submenu -->
    <div class="has-submenu">
    <button class="submenu-toggle">Load ▸</button>
    <div id="savesContainer" class="submenu"></div>
    </div>
    <button id="new file">New</button>
    <button id="delete">Delete</button>
    <button id="print">Print</button>
    </div>
  </div>
  <div class="menu-item">
    Edit
    <div class="dropdown">
      <button id="clear">Clear</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
    </div>
  </div>
      <!-- Simulated svg select -->
  <div id="duration-select" class="duration-select">
    <button
      type="button"
      id="duration-selected"
      aria-label="Selected note duration"
    >
      <span id="duration-selected-note"></span>
    </button>

    <div
      id="duration-options"
      class="duration-options"
    ></div>
  </div>
<!-- ACCIDENTAL -->
<div id="accidental-select" class="duration-select">

  <button
    type="button"
    id="accidental-selected"
    aria-label="Selected accidental"
  >
    <span id="accidental-selected-note"></span>
  </button>

  <div
    id="accidental-options"
    class="duration-options"
  ></div>

</div>


<!-- NOTE MODIFIER -->
<div id="note-modifier-select" class="duration-select">

  <button
    type="button"
    id="note-modifier-selected"
    aria-label="Selected note modifier"
  >
    <span id="note-modifier-selected-note"></span>
  </button>

  <div
    id="note-modifier-options"
    class="duration-options"
  ></div>

</div>
<!-- NOTATION ACTION / CONNECT -->

<!-- NOTATION ACTION / CONNECT -->

<div
  id="notation-action-select"
  class="notation-action-select"
>
  <button
    type="button"
    id="notation-action-selected"
    aria-label="Selected notation connectors"
    aria-haspopup="true"
    aria-expanded="false"
  >
    <span
      id="notation-action-selected-note"
    ></span>
  </button>

  <div
    id="notation-action-options"
    class="notation-action-options"
    role="group"
    aria-label="Notation connectors"
  ></div>
</div>
<button id="play">▶ Play</button>
<button id="stop">⏹ Stop</button>

<select id="instrument">
  <option value="piano">Piano</option>
  <option value="violin">Violin</option>
  <option value="viola">Viola</option>
  <option value="cello">Cello</option>
  <option value="flute">Flute</option>
  <option value="trumpet">Trumpet</option>
  <option value="clarinet">Clarinet</option>
  <option value="oboe">Oboe</option>
  <option value="bassoon">Bassoon</option>
  <option value="guitar">Guitar</option>
  <option value="harp">Harp</option>
  <option value="organ">Organ</option>
  <option value="marimba">Marimba</option>
  <option value="vibraphone">Vibraphone</option>
  <option value="xylophone">Xylophone</option>
  <option value="musicBox">Music Box</option>
  <option value="harpsichord">Harpsichord</option>
</select>

</div>



<!-- Save As Modal -->
<div id="saveAsModal" class="modal">
  <div class="modal-content">
    <span id="closeModal" class="close">&times;</span>
    <h3>Save As</h3>
    <form id="saveAsForm">
      <label for="filename">File Name:</label>
      <input type="text" id="filename" name="filename" required>
      <div class="modal-actions">
        <button type="submit">Save</button>
        <button type="button" id="cancelSave">Cancel</button>
      </div>
    </form>
  </div>
</div>


<div id="editor-grid">
  <!-- Sidebar -->
<div id="stave-editing" class="sidebar">
  <div class="sidebar-header">
    <span>Stave Options</span>
  </div>

  <div class="sidebar-content">
    <button id="Add/Change Clef">Add / Change Clef</button>
    <button id="Add/Change Time Signature">Add / Change Time Signature</button>
    <button id="Add/Change Key Signature">Add / Change Key Signature</button>
    <button id="Add/Change Notes">Add / Change Voice</button>
  </div>
</div>
  <div id="main"></div>

  <div id="options-1">
<div id="line-editing" class="sidebar">
  <div class="sidebar-header">
    <span>Line Options</span>
  </div>

  <div class="sidebar-content">
    <button id="Add Clef">Add Clef (Line)</button>
    <button id="Add Bar (all)">Add Bar (All)</button>
    <button id="Remove Bars">Remove Bar(s)</button>
    <button id="Add Line">Add Line</button>
  </div>
</div>
  </div>


</div>
    <!-- Main Elements-->
    <script type="module" src="./options.js"></script>
    <script type="module" src="./staves/staveController.js"></script>
    <script type="module" src="./selector.js"></script>
    <script type="module" src="./sheetmusic.js"></script>
    <script type="module" src="./configurations.js"></script>
    <script type="module" src="./hotbar.js"></script>
    <script type="module" src="./staves/page.js"></script>
    <script type="module" src="./noteAdding/noteAdd.js"></script>
    <script type="module" src="./midi.js"></script>
  </body>
</html>
